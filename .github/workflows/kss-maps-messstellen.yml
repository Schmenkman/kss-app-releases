name: KSS-Maps – Messstellen der Polizei (Bayern) aktualisieren

# Laedt die amtlichen Messstellenlisten des Bayerischen Innenministeriums (Blitzmarathon),
# verortet die Adressen einmalig ueber Nominatim (1 Anfrage/s, Zwischenspeicher im Repo) und
# checkt das Ergebnis als App-Daten ein. Laeuft nur bei Aenderungen am Skript oder manuell.
on:
  workflow_dispatch:
  push:
    branches: [ 'claude/bayern-navigation-app-*' ]
    paths: [ 'kss-maps/tools/fetch_messstellen.py', '.github/workflows/kss-maps-messstellen.yml' ]

permissions:
  contents: write

concurrency:
  group: kss-maps-messstellen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  messstellen:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: kss-maps
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: pdftotext bereitstellen
        run: which pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)

      - name: Messstellen laden und verorten
        run: python3 tools/fetch_messstellen.py

      - name: Ergebnis einchecken
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/messstellen/bayern.json data/geocode_cache.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Keine Aenderung."; exit 0; fi
          git commit -m "KSS-Maps: Messstellen der bayerischen Polizei aktualisiert (automatisch)"
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break
            sleep 5
          done
